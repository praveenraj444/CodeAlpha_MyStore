services:
  - type: web
    name: codealpha-mystore
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn avengers_cart.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHONUNBUFFERED
        value: True